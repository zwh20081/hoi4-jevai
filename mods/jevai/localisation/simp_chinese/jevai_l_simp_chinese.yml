l_simp_chinese:
 jevai.1.t: "JevAI：由模型指挥哪些国家？"
 jevai.1.d: "JevAI 用训练好的模型接管部分 AI 战略。它为其指挥的 AI 国家选择一种战略姿态（防御建设、工业扩张、装甲攻势、空中力量、海军力量或全面战争经济），决策频率由你在下一步选择。你自己的国家不会受到影响。\n\n模型在游戏旁边的 jevai.exe 中运行；未运行时，各国保持上一次的姿态。"
 jevai.1.a: "仅主要国家"
 jevai.1.b: "所有 AI 国家"
 jevai.1.c: "不启用（原版 AI）"
 jevai.2.t: "JevAI：模型多久决策一次？"
 jevai.2.d: "每周决策对战局反应最快，但计算量最大：在 Intel NPU 上每个国家约 1.5 秒，在 CPU 上约 10 秒。每月决策与模型学习时所用的对局一致。每 3 个月决策最省资源，适合较慢的电脑。"
 jevai.2.a: "每周"
 jevai.2.b: "每月"
 jevai.2.c: "每 3 个月"
