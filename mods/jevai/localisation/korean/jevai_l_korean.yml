l_korean:
 jevai.1.t: "JevAI: 모델이 지휘할 국가는?"
 jevai.1.d: "JevAI는 AI 전략의 일부를 학습된 모델로 대체합니다. 매달(주요 강대국만 선택하면 매주) 지휘하는 AI 국가의 전략 태세(방어 증강, 산업 확장, 기갑 공세, 공군력, 해군력, 총력전 경제)를 선택합니다. 플레이어의 국가는 영향을 받지 않습니다.\n\n모델은 게임 옆의 jevai.exe에서 실행되며, 실행 중이 아닐 때는 각 국가가 마지막 태세를 유지합니다."
 jevai.1.a: "주요 강대국만"
 jevai.1.b: "모든 AI 국가"
 jevai.1.c: "사용 안 함 (기본 AI)"
