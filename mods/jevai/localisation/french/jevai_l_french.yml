l_french:
 jevai.1.t: "JevAI : quels pays le modèle doit-il diriger ?"
 jevai.1.d: "JevAI remplace une partie de la stratégie de l'IA par un modèle entraîné. Il choisit une posture stratégique (renforcement défensif, expansion industrielle, offensive blindée, puissance aérienne, puissance navale ou économie de guerre totale) pour les pays IA qu'il dirige, à la fréquence que vous choisirez ensuite. Votre propre pays n'est jamais concerné.\n\nLe modèle tourne dans jevai.exe à côté du jeu ; tant qu'il ne tourne pas, les pays gardent leur dernière posture."
 jevai.1.a: "Grandes puissances seulement"
 jevai.1.b: "Tous les pays IA"
 jevai.1.c: "Aucun (IA standard)"
 jevai.2.t: "JevAI : à quelle fréquence le modèle doit-il décider ?"
 jevai.2.d: "Des décisions hebdomadaires réagissent le plus vite à la guerre, mais demandent le plus de calcul : environ 1,5 seconde par pays sur un NPU Intel et environ 10 secondes sur un processeur. Le rythme mensuel correspond aux parties dont le modèle a appris. Tous les 3 mois est le plus léger, adapté aux ordinateurs plus lents."
 jevai.2.a: "Chaque semaine"
 jevai.2.b: "Chaque mois"
 jevai.2.c: "Tous les 3 mois"
