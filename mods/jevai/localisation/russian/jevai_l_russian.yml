l_russian:
 jevai.1.t: "JevAI: кем будет командовать модель?"
 jevai.1.d: "JevAI заменяет часть стратегии ИИ обученной моделью. Раз в несколько месяцев она выбирает стратегическую линию (оборонительное строительство, промышленное расширение, бронетанковое наступление, авиация, флот или экономика тотальной войны) для стран ИИ, которыми командует. Ваша страна не затрагивается.\n\nМодель работает в jevai.exe рядом с игрой; пока она не запущена, страны сохраняют последнюю линию."
 jevai.1.a: "Только великие державы"
 jevai.1.b: "Все страны ИИ"
 jevai.1.c: "Никем (обычный ИИ)"
