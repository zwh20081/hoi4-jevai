l_japanese:
 jevai.1.t: "JevAI：モデルが指揮する国は？"
 jevai.1.d: "JevAI は AI の戦略の一部を学習済みモデルに置き換えます。毎月（列強のみを選んだ場合は毎週）、指揮する AI 国家の戦略方針（防衛強化、工業拡張、機甲攻勢、航空戦力、海軍力、総力戦経済）を選びます。あなたの国は影響を受けません。\n\nモデルはゲームと並行して jevai.exe で動作します。動作していない間、各国は直前の方針を維持します。"
 jevai.1.a: "列強のみ"
 jevai.1.b: "すべての AI 国家"
 jevai.1.c: "使用しない（標準 AI）"
