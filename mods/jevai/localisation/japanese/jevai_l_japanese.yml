l_japanese:
 jevai.1.t: "JevAI：モデルが指揮する国は？"
 jevai.1.d: "JevAI は AI の戦略の一部を学習済みモデルに置き換えます。指揮する AI 国家の戦略方針（防衛強化、工業拡張、機甲攻勢、航空戦力、海軍力、総力戦経済）を、次に選ぶ頻度で決めます。あなたの国は影響を受けません。\n\nモデルはゲームと並行して jevai.exe で動作します。動作していない間、各国は直前の方針を維持します。"
 jevai.1.a: "列強のみ"
 jevai.1.b: "すべての AI 国家"
 jevai.1.c: "使用しない（標準 AI）"
 jevai.2.t: "JevAI：モデルはどのくらいの頻度で判断しますか？"
 jevai.2.d: "毎週は戦況に最も早く反応しますが、計算量が最も多くなります。1 か国あたり Intel NPU で約 1.5 秒、CPU で約 10 秒かかります。毎月はモデルが学習した対局と同じ頻度です。3 か月ごとは最も軽く、性能の低い PC 向けです。"
 jevai.2.a: "毎週"
 jevai.2.b: "毎月"
 jevai.2.c: "3 か月ごと"
