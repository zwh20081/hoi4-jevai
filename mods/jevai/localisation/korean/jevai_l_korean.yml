l_korean:
 jevai.1.t: "JevAI: 모델이 지휘할 국가는?"
 jevai.1.d: "JevAI는 AI 전략의 일부를 학습된 모델로 대체합니다. 지휘하는 AI 국가의 전략 태세(방어 증강, 산업 확장, 기갑 공세, 공군력, 해군력, 총력전 경제)를 다음에 고르는 주기로 결정합니다. 플레이어의 국가는 영향을 받지 않습니다.\n\n모델은 게임 옆의 jevai.exe에서 실행되며, 실행 중이 아닐 때는 각 국가가 마지막 태세를 유지합니다."
 jevai.1.a: "주요 강대국만"
 jevai.1.b: "모든 AI 국가"
 jevai.1.c: "사용 안 함 (기본 AI)"
 jevai.2.t: "JevAI: 모델이 얼마나 자주 결정할까요?"
 jevai.2.d: "매주 결정은 전황에 가장 빠르게 반응하지만 계산량이 가장 많습니다. 국가당 Intel NPU에서 약 1.5초, CPU에서 약 10초가 걸립니다. 매월 결정은 모델이 학습한 게임과 같은 주기입니다. 3개월마다 결정하는 것이 가장 가벼워 느린 컴퓨터에 알맞습니다."
 jevai.2.a: "매주"
 jevai.2.b: "매월"
 jevai.2.c: "3개월마다"
