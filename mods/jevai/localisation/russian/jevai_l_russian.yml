l_russian:
 jevai.1.t: "JevAI: кем будет командовать модель?"
 jevai.1.d: "JevAI заменяет часть стратегии ИИ обученной моделью. Она выбирает стратегическую линию (оборонительное строительство, промышленное расширение, бронетанковое наступление, авиация, флот или экономика тотальной войны) для стран ИИ, которыми командует, так часто, как вы выберете далее. Ваша страна не затрагивается.\n\nМодель работает в jevai.exe рядом с игрой; пока она не запущена, страны сохраняют последнюю линию."
 jevai.1.a: "Только великие державы"
 jevai.1.b: "Все страны ИИ"
 jevai.1.c: "Никем (обычный ИИ)"
 jevai.2.t: "JevAI: как часто модель будет принимать решения?"
 jevai.2.d: "Еженедельные решения быстрее всего реагируют на ход войны, но требуют больше всего вычислений: около 1,5 секунды на страну на Intel NPU и около 10 секунд на процессоре. Ежемесячные соответствуют партиям, на которых училась модель. Раз в 3 месяца — самый лёгкий вариант для медленных компьютеров."
 jevai.2.a: "Каждую неделю"
 jevai.2.b: "Каждый месяц"
 jevai.2.c: "Раз в 3 месяца"
